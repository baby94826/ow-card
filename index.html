<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overwatch 2 個人數據卡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <!-- 1. 搜尋輸入區塊 -->
        <div class="search-box">
            <input type="text" id="battleTagInput" placeholder="輸入 BattleTag (例如: Player#1234)" />
            <button id="searchBtn" onclick="fetchPlayerData()">🔍 查詢數據</button>
        </div>
        
        <!-- 提示訊息/載入狀態 -->
        <div id="statusMessage" class="status-msg">請輸入正確的 BattleTag (注意：遊戲內個人檔案需設為公開)</div>

        <!-- 2. 數據卡片本體 -->
        <div class="ow-card" id="myCard">
            <div class="card-header">
                <div class="rank-icon">
                    <div class="diamond-icon"></div>
                </div>
                <div class="player-info">
                    <h2 id="cardPlayerName">PLAYERNAME#1234</h2>
                    <span id="cardTitle">等級 / 狀態: -</span>
                </div>
            </div>

            <div class="stats-summary">
                <div class="stat-item">
                    <div class="stat-value" id="cardWinRate">0%</div>
                    <div class="stat-label">勝率 (Win %)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="cardKDA">0.0</div>
                    <div class="stat-label">KDA 比例</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="cardTotalWins">0</div>
                    <div class="stat-label">總勝場</div>
                </div>
            </div>

            <div class="top-heroes">
                <span class="section-title">常用英雄 (總計)</span>
                
                <div class="hero-item">
                    <div class="hero-avatar hero-tracer" id="hero1Tag">H1</div>
                    <div class="hero-details">
                        <div class="hero-name" id="hero1Name">常用英雄 1</div>
                        <div class="hero-time" id="hero1Time">使用時數: -</div>
                    </div>
                    <div class="hero-win-rate" id="hero1WR">-</div>
                </div>

                <div class="hero-item">
                    <div class="hero-avatar hero-genji" id="hero2Tag">H2</div>
                    <div class="hero-details">
                        <div class="hero-name" id="hero2Name">常用英雄 2</div>
                        <div class="hero-time" id="hero2Time">使用時數: -</div>
                    </div>
                    <div class="hero-win-rate" id="hero2WR">-</div>
                </div>
            </div>
        </div>

        <!-- 3. 下載按鈕 -->
        <div class="action-area">
            <button id="downloadBtn" onclick="downloadCard()">📸 下載個人數據卡</button>
            <div class="author-tag">Designed & Developed by Your Name</div>
        </div>
    </div>

    <!-- 載入截圖套件與腳本 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
<div class="search-box">
    <input type="text" id="battleTagInput" placeholder="輸入 BattleTag (例如: Player#1234)">
    
    <!-- 遊戲模式篩選器 -->
    <select id="gamemodeSelect">
        <option value="all">所有模式 (生涯總計)</option>
        <option value="quickplay">快速對戰</option>
        <option value="competitive">競技對戰</option>
    </select>

    <!-- 特定英雄篩選器 -->
    <select id="heroSelect">
        <option value="all">全英雄總計</option>
        <!-- JavaScript 會自動動態填入所有英雄選項 -->
    </select>

    <button id="searchBtn" onclick="fetchPlayerData()">查詢數據</button>
</div>
