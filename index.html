<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overwatch 2 個人數據卡</title>
    <!-- 載入 CSS 樣式 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <!-- 數據卡片本體 -->
        <div class="ow-card" id="myCard">
            <!-- 1. 玩家資訊頭部 -->
            <div class="card-header">
                <div class="rank-icon">
                    <div class="diamond-icon"></div>
                </div>
                <div class="player-info">
                    <h2>PLAYERNAME#1234</h2>
                    <span>主力職位: 輸出 (Damage)</span>
                </div>
            </div>

            <!-- 2. 關鍵統計數據 -->
            <div class="stats-summary">
                <div class="stat-item">
                    <div class="stat-value">58%</div>
                    <div class="stat-label">勝率 (Win %)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">3.45</div>
                    <div class="stat-label">KDA 比例</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">8.2k</div>
                    <div class="stat-label">場均傷害</div>
                </div>
            </div>

            <!-- 3. 常用英雄 -->
            <div class="top-heroes">
                <span class="section-title">TOP 2 HEROES (本賽季)</span>
                
                <div class="hero-item">
                    <div class="hero-avatar hero-tracer">TR</div>
                    <div class="hero-details">
                        <div class="hero-name">閃光 (Tracer)</div>
                        <div class="hero-time">使用時數: 15 小時</div>
                    </div>
                    <div class="hero-win-rate">62% WR</div>
                </div>

                <div class="hero-item">
                    <div class="hero-avatar hero-genji">GJ</div>
                    <div class="hero-details">
                        <div class="hero-name">源氏 (Genji)</div>
                        <div class="hero-time">使用時數: 10 小時</div>
                    </div>
                    <div class="hero-win-rate">58% WR</div>
                </div>
            </div>
        </div>

        <!-- 4. 下載按鈕與個人品牌標籤 -->
        <div class="action-area">
            <button id="downloadBtn" onclick="downloadCard()">📸 下載個人數據卡</button>
            <div class="author-tag">Designed & Developed by Your Name</div>
        </div>
    </div>

    <!-- 載入截圖套件與 JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
