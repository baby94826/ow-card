<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《鬥陣特攻 2》玩家數據卡片產生器</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入截圖套件 html2canvas -->
    <script src="https://cdnjs.cloudflare.com/org/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>《鬥陣特攻 2》數據卡片產生器</h1>
        
        <!-- 搜尋與篩選區域 -->
        <div class="search-box">
            <input type="text" id="battleTagInput" placeholder="輸入 BattleTag (例如: Player#1234)">
            
            <div class="filter-group">
                <select id="gamemodeSelect">
                    <option value="all">所有模式 (生涯總計)</option>
                    <option value="quickplay">快速對戰</option>
                    <option value="competitive">競技對戰</option>
                </select>

                <select id="heroSelect">
                    <option value="all">全英雄總計</option>
                </select>
            </div>

            <button id="searchBtn" onclick="fetchPlayerData()">查詢數據</button>
        </div>

        <p id="statusMessage" class="status-msg"></p>

        <!-- 數據卡片本體 -->
        <div id="myCard" class="stats-card">
            <!-- 標頭區 -->
            <div class="card-header">
                <div class="player-info">
                    <h2 id="cardPlayerName">PlayerName</h2>
                    <p id="cardTitle" class="card-title">稱號: 待查詢</p>
                </div>
                <div class="game-logo">OW2</div>
            </div>

            <!-- 核心獨立數據三大區塊 -->
            <div class="metrics-grid">
                <div class="metric-box">
                    <span class="metric-label">勝場數</span>
                    <div class="metric-value highlight-orange" id="cardTotalWins">0</div>
                    <span class="metric-sub">WINS</span>
                </div>

                <div class="metric-box">
                    <span class="metric-label">勝率</span>
                    <div class="metric-value highlight-green" id="cardWinRate">0%</div>
                    <span class="metric-sub">WIN RATE</span>
                </div>

                <div class="metric-box">
                    <span class="metric-label">KDA 比率</span>
                    <div class="metric-value highlight-blue" id="cardKDA">0.0</div>
                    <span class="metric-sub">K / D / A</span>
                </div>
            </div>

            <!-- 常用英雄列表區 -->
            <div class="heroes-section">
                <h3 class="section-title">HERO STATS</h3>
                
                <div class="hero-item">
                    <div class="hero-avatar" id="hero1Tag">H1</div>
                    <div class="hero-details">
                        <div class="hero-header">
                            <span id="hero1Name" class="hero-name">常用英雄 1</span>
                            <span id="hero1WR" class="hero-wr">-</span>
                        </div>
                        <div id="hero1Time" class="hero-time">請搜尋 BattleTag 載入數據</div>
                    </div>
                </div>

                <div class="hero-item">
                    <div class="hero-avatar" id="hero2Tag">H2</div>
                    <div class="hero-details">
                        <div class="hero-header">
                            <span id="hero2Name" class="hero-name">常用英雄 2</span>
                            <span id="hero2WR" class="hero-wr">-</span>
                        </div>
                        <div id="hero2Time" class="hero-time">請搜尋 BattleTag 載入數據</div>
                    </div>
                </div>
            </div>
        </div>

        <button class="download-btn" onclick="downloadCard()">📸 下載個人數據卡</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
